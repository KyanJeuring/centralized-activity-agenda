services:
  backend:
    hostname: laravel_backend_prod
    container_name: laravel_backend_prod
    build:
      context: .
      dockerfile: backend/Dockerfile.production
    working_dir: /var/www
    ports:
      - "${BACKEND_PORT}:8000"
    environment:
      TZ: UTC
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: "http://localhost:${BACKEND_PORT}"
      BACKEND_PORT: ${BACKEND_PORT}
      POSTGRES_HOST: database
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy

  frontend:
    hostname: vue_frontend_prod
    container_name: vue_frontend_prod
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        VITE_API_BASE: "http://localhost:${BACKEND_PORT}/api/v1"
    ports:
      - "${FRONTEND_PORT}:80"
    environment:
      TZ: UTC
    restart: unless-stopped
    depends_on:
      - backend

  database:
    image: postgres:17-alpine
    container_name: postgres_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data_prod: